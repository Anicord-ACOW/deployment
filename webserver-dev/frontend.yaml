apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/name: frontend
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: frontend
        image: ghcr.io/anicord-acow/frontend@sha256:62bb776e59336d912b91ec5555bf426f6daabce38d0cbd135f7e45e703c3b4fc
        ports:
        - containerPort: 3000
        env:
        - name: API_ORIGIN
          valueFrom:
            secretKeyRef:
              name: webserver-secrets
              key: API_ORIGIN
        - name: ORIGIN
          value: "https://anidev.cestpaspete.ovh"
---

apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 3000
    nodePort: 13003
  selector:
    app: frontend
