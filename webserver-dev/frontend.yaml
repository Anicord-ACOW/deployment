apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/name: frontend
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: frontend
        image: ghcr.io/anicord-acow/frontend@sha256:82d9d68615c0652181a3dfdd5cf8dbf5b4f728d35365d9a5ffe6d9a6c6669993
        ports:
        - containerPort: 3000
        env:
        - name: API_ORIGIN
          valueFrom:
            secretKeyRef:
              name: webserver-secrets
              key: API_ORIGIN
---

apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 3000
    nodePort: 13003
  selector:
    app: frontend
